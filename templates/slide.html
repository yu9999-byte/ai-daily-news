<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 早报</title>
<style>
  :root {
    --accent: #FF6B35;
    --accent-dark: #E55A2B;
    --paper: #FAF9F7;
    --ink: #1A1A1A;
    --ink-2: #4A4A4A;
    --ink-3: #8A8A8A;
    --line: #E5E3DF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    background: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }

  /* 顶部细线 */
  .top-rule {
    position: absolute;
    top: 60px;
    left: 80px;
    right: 80px;
    height: 2px;
    background: var(--accent);
  }

  /* 右上角来源 */
  .source-channel {
    position: absolute;
    top: 80px;
    right: 80px;
    font-size: 22px;
    color: var(--ink-3);
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  /* 右下角出处 */
  .source-name {
    position: absolute;
    bottom: 80px;
    right: 80px;
    font-size: 20px;
    color: var(--ink-2);
    font-weight: 500;
  }

  /* ===== 片头 ===== */
  .slide-cover {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 0 120px;
  }

  .slide-cover .label {
    font-size: 28px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 8px;
    margin-bottom: 30px;
  }

  .slide-cover .title {
    font-size: 120px;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1.1;
    margin-bottom: 30px;
  }

  .slide-cover .date {
    font-size: 36px;
    color: var(--ink-2);
    font-weight: 500;
    margin-bottom: 20px;
  }

  .slide-cover .count {
    font-size: 28px;
    color: var(--ink-3);
    font-weight: 400;
  }

  .slide-cover .count strong {
    color: var(--accent);
    font-weight: 700;
    font-size: 36px;
  }

  /* ===== 新闻页 ===== */
  .slide-news {
    padding: 140px 100px 120px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .slide-news .index {
    font-size: 24px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }

  .slide-news .index span {
    color: var(--ink-3);
    font-weight: 400;
  }

  .slide-news .title {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -1px;
    margin-bottom: 48px;
    max-width: 1720px;
  }

  .slide-news .points {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 40px;
  }

  .slide-news .point {
    font-size: 32px;
    line-height: 1.5;
    color: var(--ink-2);
    padding-left: 24px;
    position: relative;
    max-width: 1600px;
  }

  .slide-news .point::before {
    content: "";
    position: absolute;
    left: 0;
    top: 18px;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
  }

  .slide-news .key-numbers {
    display: flex;
    gap: 60px;
    margin-top: auto;
  }

  .slide-news .key-number {
    display: flex;
    flex-direction: column;
  }

  .slide-news .key-number .value {
    font-size: 96px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -2px;
  }

  .slide-news .key-number .label {
    font-size: 20px;
    color: var(--ink-3);
    margin-top: 8px;
    font-weight: 500;
  }

  /* ===== 片尾 ===== */
  .slide-end {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
  }

  .slide-end .thanks {
    font-size: 72px;
    font-weight: 800;
    margin-bottom: 24px;
  }

  .slide-end .sub {
    font-size: 28px;
    color: var(--ink-3);
    margin-bottom: 40px;
  }

  .slide-end .accent-dot {
    width: 16px;
    height: 16px;
    background: var(--accent);
    border-radius: 50%;
  }

  /* 页码 */
  .page-num {
    position: absolute;
    bottom: 80px;
    left: 80px;
    font-size: 20px;
    color: var(--ink-3);
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="top-rule"></div>
  <div class="source-channel" id="sourceChannel"></div>
  <div class="source-name" id="sourceName"></div>
  <div class="page-num" id="pageNum"></div>

  <!-- 内容容器，JS 动态填充 -->
  <div id="slideContent"></div>

<script>
  // 接收来自 Playwright 的数据
  window.renderSlide = function(data) {
    const content = document.getElementById('slideContent');
    const sourceChannel = document.getElementById('sourceChannel');
    const sourceName = document.getElementById('sourceName');
    const pageNum = document.getElementById('pageNum');

    sourceChannel.textContent = data.sourceChannel || '';
    sourceName.textContent = data.sourceName || '';
    pageNum.textContent = data.pageNum || '';

    if (data.type === 'cover') {
      content.innerHTML = `
        <div class="slide-cover">
          <div class="label">AI DAILY BRIEF</div>
          <div class="title">AI 早报</div>
          <div class="date">${data.date}</div>
          <div class="count">今日 <strong>${data.total}</strong> 条精选</div>
        </div>
      `;
    } else if (data.type === 'news') {
      const pointsHtml = (data.points || []).map(p =>
        `<div class="point">${p}</div>`
      ).join('');

      const keyNumbersHtml = (data.keyNumbers || []).map(k =>
        `<div class="key-number">
          <div class="value">${k.value || k}</div>
          <div class="key-label">${k.label || ''}</div>
        </div>`
      ).join('');

      content.innerHTML = `
        <div class="slide-news">
          <div class="index">NO.${String(data.index).padStart(2, '0')} <span>/ ${String(data.total).padStart(2, '0')}</span></div>
          <div class="title">${data.title}</div>
          <div class="points">${pointsHtml}</div>
          <div class="key-numbers">${keyNumbersHtml}</div>
        </div>
      `;
    } else if (data.type === 'end') {
      content.innerHTML = `
        <div class="slide-end">
          <div class="thanks">以上就是今天的 AI 早报</div>
          <div class="sub">明天见</div>
          <div class="accent-dot"></div>
        </div>
      `;
    }
  };
</script>
</body>
</html>
